name: Update SNL Schedule

on:
  schedule:
    # Daily at 09:00 UTC (≈ 4-5am ET, after Saturday's broadcast)
    - cron: "0 9 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # 6.0.2
        with:
          python-version: "3.14"

      - name: Run updater
        id: update
        run: python scripts/update_schedule.py

      - name: Create pull request
        if: steps.update.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/snl-schedule-update
          SEASON: ${{ steps.update.outputs.season }}
          ADDED: ${{ steps.update.outputs.added_count }}
          CHANGED: ${{ steps.update.outputs.changed_count }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add index.html

          if git diff --cached --quiet; then
            echo "No staged changes to index.html; skipping PR."
            exit 0
          fi

          BODY=$(printf '+%s added,\n~%s changed' "$ADDED" "$CHANGED")
          git commit -m "chore(schedule): sync season $SEASON from TVMaze" -m "$BODY"
          git push --force origin "$BRANCH"

          TITLE="Sync SNL Season $SEASON schedule"

          if gh pr view "$BRANCH" --json state --jq .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file CHANGES.md
          else
            gh pr create \
              --title "$TITLE" \
              --body-file CHANGES.md \
              --base main \
              --head "$BRANCH" \
              --label automated \
              --label schedule-update
          fi

      - name: Cleanup CHANGES.md
        if: always()
        run: rm -f CHANGES.md
